name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # npmjs trusted publishing (OIDC). Do not add NODE_AUTH_TOKEN / NPM_TOKEN.
  id-token: write

jobs:
  publish:
    name: Publish client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # packageManager in package.json pins the bun version.
          bun-version-file: package.json

      # Official Node+npm on PATH for the OIDC publish: bun packs, npm publishes.
      # Do not set registry-url: it writes an empty _authToken and breaks trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"

      - run: bun ci

      - name: Publish @better-bull-board/client
        working-directory: packages/client
        run: |
          NAME="$(bun -p "require('./package.json').name")"
          VERSION="$(bun -p "require('./package.json').version")"
          PUBLISHED="$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Version ${VERSION} is already published; skipping."
            exit 0
          fi
          bun run pack:check
          # bun pm pack rewrites workspace: ranges, which npm publish would ship as-is.
          TARBALL="$(bun pm pack --quiet)"
          npm publish "$TARBALL" --access public
