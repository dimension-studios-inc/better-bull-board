name: Publish

# Publishes @better-bull-board/client to npm. Release keeps the client's release pull request open,
# and merging it publishes a client-v<version> GitHub release, which runs this workflow
# (docs/publishing.md). To retry a failed publish, re-run its run.
on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish client
    # The app's releases (v<version>) go to the cluster through Deploy, not to npm.
    if: startsWith(github.event.release.tag_name, 'client-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npmjs trusted publishing (OIDC). Do not add NODE_AUTH_TOKEN / NPM_TOKEN.
    steps:
      # The release's tag
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # packageManager in package.json pins the bun version.
          bun-version-file: package.json

      # Official Node+npm on PATH for the OIDC publish (npm >= 11.5.1).
      # Do not set registry-url: it writes an empty _authToken and breaks trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"

      - run: bun ci

      # The version lives in the client-v* tags and the release-please manifest, not in
      # packages/client/package.json (docs/publishing.md).
      - name: Set the version
        working-directory: packages/client
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm pkg set version="${TAG#client-v}"

      # bun pm pack rewrites workspace: ranges; npm publishes the tarball through trusted publishing.
      - name: Publish
        working-directory: packages/client
        run: bun run pack:check && npm publish "$(bun pm pack --quiet)" --access public
