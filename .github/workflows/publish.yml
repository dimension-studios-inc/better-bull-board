name: Publish

# Releases @better-bull-board/client with semantic-release when Promote moves main: the next
# version comes from the conventional commits touching packages/client (docs/publishing.md).
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # client-v* tags and GitHub releases
      issues: write # "released in" comments
      pull-requests: write
      id-token: write # npmjs trusted publishing (OIDC). Do not add NODE_AUTH_TOKEN / NPM_TOKEN.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # semantic-release reads the client-v* tags and the commits since the last one.
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # packageManager in package.json pins the bun version.
          bun-version-file: package.json

      # Official Node+npm on PATH for the OIDC publish (npm >= 11.5.1).
      # Do not set registry-url: it writes an empty _authToken and breaks trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"

      - run: bun ci

      - run: bun run release:client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
