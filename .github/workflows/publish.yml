name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # npmjs trusted publishing (OIDC). Do not add NODE_AUTH_TOKEN / NPM_TOKEN.
  id-token: write

jobs:
  publish:
    name: Publish client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Trusted publishing uses GitHub OIDC. Do not add NODE_AUTH_TOKEN / NPM_TOKEN.
      - name: Setup pnpm
        uses: pnpm/setup@v2.0.2
        with:
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish @better-bull-board/client
        working-directory: packages/client
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(pnpm view "${NAME}@${VERSION}" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Version ${VERSION} is already published; skipping."
            exit 0
          fi
          pnpm publish --access public --no-git-checks
