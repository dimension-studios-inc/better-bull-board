name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # npm trusted publishing (OIDC). Do not add NODE_AUTH_TOKEN / NPM_TOKEN.
  id-token: write

jobs:
  publish:
    name: Publish client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      # Do not set registry-url: setup-node writes an empty _authToken and
      # npm then skips the OIDC handshake.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish @better-bull-board/client
        working-directory: packages/client
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Version ${VERSION} is already on npm; skipping."
            exit 0
          fi
          npm publish --access public
