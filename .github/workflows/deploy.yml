name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/n5q7l0s4
  K8S_NAMESPACE: better-bull-board

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: better-bull-board-app
            dockerfile: apps/app/Dockerfile
          - image: better-bull-board-ingest
            dockerfile: apps/ingest/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          mask-aws-account-id: "false"

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2.1.7
        with:
          registry-type: public

      # Docker's default BuildKit builder, without a GitHub Actions cache: every promotion changes
      # the sources or the lockfile, so the cache served 1-2 steps out of 20 while exporting it took
      # twice as long as the build itself (165 s for the app).
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:latest

  deploy:
    name: Rollout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    needs: build
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > ~/.kube/config

      # Pin the workloads to this commit's images rather than restarting on :latest: the pods run
      # exactly what this run built, overlapping deploys cannot swap images, and
      # `kubectl rollout undo` goes back to the previous commit.
      - name: Deploy this commit's images
        env:
          SHA: ${{ github.sha }}
        run: |
          kubectl set image deployment/bbb-app app="$ECR_REGISTRY/better-bull-board-app:$SHA" -n "$K8S_NAMESPACE"
          kubectl set image statefulset/bbb-ingest bbb-ingest="$ECR_REGISTRY/better-bull-board-ingest:$SHA" -n "$K8S_NAMESPACE"

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/bbb-app -n "$K8S_NAMESPACE" --timeout=5m
          kubectl rollout status statefulset/bbb-ingest -n "$K8S_NAMESPACE" --timeout=5m
