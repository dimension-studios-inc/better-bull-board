name: Deploy

# Puts a release of the app and ingest in production. Merging to main deploys nothing: Release keeps
# a release pull request open, and merging it publishes a v<version> GitHub release, which runs this
# workflow (docs/deploying.md). Run it by hand to deploy again, or to roll back (or forward) to
# another release or any commit of main:
#
#   gh workflow run deploy.yml                  # the latest release
#   gh workflow run deploy.yml -f ref=v1.2.0    # a release, or a full commit SHA
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or full commit SHA to deploy (defaults to the latest release)
        required: false

# Deploys run one after the other, and none is cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/n5q7l0s4
  K8S_NAMESPACE: better-bull-board

jobs:
  commit:
    name: Check the commit
    # The client's releases (client-v<version>) go to npm through Publish, not to the cluster.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    env:
      REF: ${{ inputs.ref || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only what main holds goes to production, and only once Check has passed on that very commit.
      - name: Check the commit
        id: check
        run: |
          set -euo pipefail
          if [ -z "$REF" ]; then
            REF="$(gh api "repos/$GH_REPO/releases" --jq '[.[] | select(.draft | not) | select(.tag_name | startswith("v"))][0].tag_name // empty')"
            if [ -z "$REF" ]; then
              echo "::error::There is no release to deploy"
              exit 1
            fi
          fi
          if ! sha="$(gh api "repos/$GH_REPO/commits/$REF" --jq .sha)"; then
            echo "::error::'$REF' is neither a tag nor a commit of this repository"
            exit 1
          fi
          status="$(gh api "repos/$GH_REPO/compare/$sha...main" --jq .status)"
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::$REF ($sha) is not on main"
            exit 1
          fi
          # The release commit's Check can still be running when a later commit's CI started Release.
          for _ in $(seq 1 40); do
            check="$(gh api "repos/$GH_REPO/commits/$sha/check-runs?check_name=Check&filter=latest" --jq '.check_runs[0] | if . == null then "missing" elif .status != "completed" then "running" else .conclusion end')"
            [ "$check" = running ] || break
            sleep 15
          done
          if [ "$check" != success ]; then
            echo "::error::Check on $REF ($sha) is $check, not success"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$REF\` ($sha)" >> "$GITHUB_STEP_SUMMARY"

  # One job per image: it builds and rolls out as soon as its own image is ready, and skips both
  # when nothing it is built from changed since the last deploy.
  deploy:
    name: ${{ matrix.image }}
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: better-bull-board-app
            dockerfile: apps/app/Dockerfile
            package: "@better-bull-board/app"
            workload: deployment/bbb-app
            container: app
            extra-inputs: ""
          - image: better-bull-board-ingest
            dockerfile: apps/ingest/Dockerfile
            package: "@better-bull-board/ingest"
            workload: statefulset/bbb-ingest
            container: bbb-ingest
            extra-inputs: scripts/trace-runtime.ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          # Compared with the deployed commit
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # packageManager in package.json pins the bun version.
          bun-version-file: package.json

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > ~/.kube/config

      # Deploys tag images with their commit: the running tag says what is in production.
      - name: Read the deployed commit
        id: deployed
        run: |
          image="$(kubectl get "${{ matrix.workload }}" -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="${{ matrix.container }}")].image}')"
          echo "Running: $image"
          echo "sha=${image##*:}" >> "$GITHUB_OUTPUT"

      - name: Check whether the image changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          DEPLOYED: ${{ steps.deployed.outputs.sha }}
        run: .github/scripts/image-changed.sh "${{ matrix.package }}" ${{ matrix.extra-inputs }}

      - name: Configure AWS credentials
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          mask-aws-account-id: "false"

      - name: Login to Amazon ECR Public
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/amazon-ecr-login@v2.1.7
        with:
          registry-type: public

      # Docker's default BuildKit builder, without a GitHub Actions cache: every release changes
      # the sources or the lockfile, so the cache served 1-2 steps out of 20 while exporting it took
      # twice as long as the build itself (165 s for the app).
      - name: Build and push
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ needs.commit.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:latest

      # Pin the workload to this commit's image rather than restarting on :latest: the pods run
      # exactly what this run built, overlapping deploys cannot swap images, and
      # `kubectl rollout undo` goes back to the previous image.
      - name: Roll out
        if: steps.changes.outputs.changed == 'true'
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ needs.commit.outputs.sha }}
        run: |
          kubectl set image "${{ matrix.workload }}" "${{ matrix.container }}=$IMAGE" -n "$K8S_NAMESPACE"
          kubectl rollout status "${{ matrix.workload }}" -n "$K8S_NAMESPACE" --timeout=5m
