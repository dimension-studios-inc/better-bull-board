name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete; don't pay for it twice.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    # Draft PRs: skip until ready_for_review (still in `on.pull_request.types`).
    # workflow_dispatch has no pull_request payload, so draft is empty/falsy and this runs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # packageManager in package.json pins the bun version.
          bun-version-file: package.json

      - run: bun ci
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test

      - name: Verify client pack includes types
        working-directory: packages/client
        run: bun run pack:check

      - run: bun run knip
        env:
          # knip loads packages/db/drizzle.config.ts, which throws without a URL; it never connects
          DATABASE_URL: postgresql://knip:knip@localhost:5432/knip
