apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bbb-ingest
  namespace: better-bull-board
  labels:
    app: bbb-ingest
spec:
  serviceName: bbb-ingest-headless
  replicas: 1
  selector:
    matchLabels:
      app: bbb-ingest
  template:
    metadata:
      labels:
        app: bbb-ingest
    spec:
      containers:
        - name: bbb-ingest
          # deploy.yml sets the image to its commit's tag; :latest is the last image built from main
          image: public.ecr.aws/n5q7l0s4/better-bull-board-ingest:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bbb-ingest-config
            - secretRef:
                name: bbb-ingest-secret
          # Database migrations run at startup, before the health server listens: give them up to
          # 30 minutes (a large index build) before the liveness probe can restart the pod. Probing
          # every 2 s marks the pod started as soon as they finish (900 x 2 s = 30 minutes).
          startupProbe:
            httpGet:
              path: /live
              port: 3001
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 900
          livenessProbe:
            httpGet:
              path: /live
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
---
# Headless service for stable DNS (required by StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: bbb-ingest-headless
  namespace: better-bull-board
  labels:
    app: bbb-ingest
spec:
  clusterIP: None
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: bbb-ingest

---
# Regular ClusterIP service for ingress routing
apiVersion: v1
kind: Service
metadata:
  name: bbb-ingest-service
  namespace: better-bull-board
  labels:
    app: bbb-ingest
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: bbb-ingest

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bbb-ingest-ingress
  namespace: better-bull-board
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-nginx
    # The F5 NGINX Ingress Controller only proxies WebSocket upgrades for the listed services
    nginx.org/websocket-services: bbb-ingest-service
    # No heartbeat on the socket: keep idle connections open
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "wss.bbb.k3s.dimensionstudios.co"
      secretName: ingest-k3s-letsencrypt-tls
  rules:
    - host: "wss.bbb.k3s.dimensionstudios.co"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bbb-ingest-service
                port:
                  number: 8080
