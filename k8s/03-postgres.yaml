apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bbb-postgres
  namespace: better-bull-board
  labels:
    app: bbb-postgres
spec:
  serviceName: bbb-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: bbb-postgres
  template:
    metadata:
      labels:
        app: bbb-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: bbb-postgres
          image: public.ecr.aws/n5q7l0s4/better-bull-board-postgres:latest
          imagePullPolicy: Always
          # Postgres defaults target tiny machines (shared_buffers=128MB, work_mem=4MB): size them for the 8Gi limit.
          # Check with `SHOW shared_buffers` and the cache hit ratio / temp files in pg_stat_database.
          args:
            - "-c"
            - "shared_buffers=2GB"
            - "-c"
            - "effective_cache_size=6GB"
            - "-c"
            - "work_mem=16MB"
            - "-c"
            - "maintenance_work_mem=512MB"
          ports:
            - containerPort: 5432
              name: bbb-postgres
          envFrom:
            - configMapRef:
                name: bbb-postgres-config
            - secretRef:
                name: bbb-postgres-secret
          volumeMounts:
            - name: bbb-postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: bbb-postgres # ensures clean separation in PVC
            # Parallel queries use /dev/shm, limited to 64Mi by default in Kubernetes
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: "OnRootMismatch"
  volumeClaimTemplates:
    - metadata:
        name: bbb-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi # bump default storage for production
---
apiVersion: v1
kind: Service
metadata:
  name: bbb-postgres-headless
  namespace: better-bull-board
  labels:
    app: bbb-postgres
spec:
  clusterIP: None # headless service for stable DNS
  ports:
    - port: 5432
      name: bbb-postgres
  selector:
    app: bbb-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: bbb-postgres-service
  namespace: better-bull-board
  labels:
    app: bbb-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: bbb-postgres
  selector:
    app: bbb-postgres
