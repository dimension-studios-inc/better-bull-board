apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbb-app
  namespace: better-bull-board
  labels:
    app: better-bull-board-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bbb-app
  template:
    metadata:
      labels:
        app: bbb-app
    spec:
      containers:
        - name: app
          # deploy.yml sets the image to its commit's tag; :latest is the last image built from main
          image: public.ecr.aws/n5q7l0s4/better-bull-board-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bbb-app-config
            - secretRef:
                name: bbb-app-secret
          # The server listens within a second: probe often while it starts, so the new pod takes
          # traffic (and the old one stops) as soon as it is up instead of after fixed delays.
          # Liveness and readiness only begin once it succeeds; 30 x 2 s covers a slow start.
          startupProbe:
            httpGet:
              path: /live
              port: 3000
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "2Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: bbb-app-service
  namespace: better-bull-board
  labels:
    app: bbb-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: bbb-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bbb-app-ingress
  namespace: better-bull-board
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "bbb.k3s.dimensionstudios.co"
      secretName: app-k3s-letsencrypt-tls
  rules:
    - host: "bbb.k3s.dimensionstudios.co"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bbb-app-service
                port:
                  number: 80
