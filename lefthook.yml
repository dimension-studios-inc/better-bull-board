pre-commit:
  commands:
    lint:
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx}"
      # Type-aware rules need the workspace packages built; turbo's cache keeps this near-instant.
      run: bun run setup --output-logs=errors-only && bunx oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx,json,jsonc,css,yml,yaml,toml,md}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
